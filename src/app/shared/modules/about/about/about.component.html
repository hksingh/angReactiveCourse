<mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
  <mat-tab label="Beginners">
    <div class="card-container">
      @for (course of beginnerCourseData$ | async; track course.id) {
        <shared-my-card [course]="course"></shared-my-card>
      }
    </div>
  </mat-tab>
  <mat-tab label="Advanced">
    <div class="card-container">
      @for (course of advancedCourseData$ | async; track course.id) {
        <shared-my-card [course]="course"></shared-my-card>
      }
    </div>
  </mat-tab>
</mat-tab-group>
